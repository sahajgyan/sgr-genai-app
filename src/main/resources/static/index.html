<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Workflow Submission Client</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <div class="container">
        <header>
            <h1>Async Workflow Client</h1>
            <p>Select a workflow ID and submit the required JSON payload to start polling for results</p>
        </header>

        <div class="main-layout">

            <div class="request-column">
                <h2>Request</h2>
                <section class="form-group">
                    <label for="workflowIdSelect">Workflow ID:</label>
                    <select id="workflowIdSelect" class="input-field">
                        <option value="">Loading Workflows...</option>
                        <option value="kinematics-solver">Kinematics Solver</option>
                        <option value="assessment-enrichment">Assessment Enrichment</option>
                        <option value="chemistry-balancer">Chemistry Balancer</option>
                    </select>
                </section>

                <section class="form-group">
                    <label for="postDataInput">Payload Data (JSON):</label>
                    <textarea id="postDataInput" class="input-field" placeholder='{"user": "client", "data": "payload"}'
                        rows="10"></textarea>
                </section>

                <button id="submitBtn" class="primary-btn" disabled>Submit Workflow</button>
            </div>

            <div class="response-column">
                <h2>Status & Summary</h2>

                <div class="status-section">
                    <h3 class="section-title">Current Status:</h3>
                    <pre id="statusMessage" class="status-output">Awaiting workflows list...</pre>
                </div>

                <div class="result-section">
                    <h3 class="section-title">Result Summary:</h3>
                    <ul id="resultSummary" class="result-summary-list">
                    </ul>
                </div>
            </div>
        </div>

        <div class="full-result-footer" style="margin-top: 30px;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
                <h3 class="section-title" style="margin: 0;">Raw JSON Result (Full)</h3>

                <button id="visualizeBtn" onclick="launchVisualizer()"
                    style=" background-color: #4f46e5; color: white; padding: 10px 24px; border-radius: 8px; font-weight: bold; border: none; cursor: pointer; transition: background-color 0.2s;">
                    ✨ Visualize & Solve
                </button>
            </div>

            <pre id="fullResultContainer" class="result-output"
                style="background: #f4f4f5; padding: 15px; border-radius: 8px; overflow-x: auto;">The complete, raw JSON output will appear here after the job is complete.</pre>
        </div>
    </div>

    <script src="app.js"></script>

    <script>
        function launchVisualizer() {
            // 1. Grab the raw JSON Response text from the result container
            const resultElement = document.getElementById('fullResultContainer');
            const rawResponseText = resultElement.innerText || resultElement.textContent;

            // 2. Grab the raw JSON Request text from the input textarea
            const requestInputElement = document.getElementById('postDataInput');
            const rawRequestText = requestInputElement.value;

            // 3. Grab the currently selected workflow from your dropdown
            const workflowSelect = document.getElementById('workflowIdSelect');
            const selectedWorkflow = workflowSelect.value;

            // Safety check: ensure a workflow is actually selected
            if (!selectedWorkflow) {
                alert("No workflow selected. Please select a workflow first.");
                return;
            }

            // 4. Define your Routing Dictionary
            const routeMap = {
                "assessment-enrichment": "visualizer.html",
                "kinematics-solver": "physics-visualizer.html",
                "chemistry-balancer": "chem-visualizer.html"
            };

            const targetPage = routeMap[selectedWorkflow] || `${selectedWorkflow}.html`;

            try {
                // 5. Parse Response to ensure it is valid JSON
                const responseJson = JSON.parse(rawResponseText);

                // 6. Parse Request to ensure it is valid JSON
                const requestJson = JSON.parse(rawRequestText);

                // 7. Save BOTH to session storage
                // 'scaffoldPayload' stores the result/output
                sessionStorage.setItem('scaffoldPayload', JSON.stringify(responseJson));

                // 'workflowRequest' stores the original input/request
                sessionStorage.setItem('workflowRequest', JSON.stringify(requestJson));

                // 8. Launch the specific visualizer in a new tab
                window.open(targetPage, '_blank');

            } catch (error) {
                alert("Error: One of the JSON payloads is invalid. Please check your input and ensure the workflow has completed.");
                console.error("Parsing Error:", error);
            }
        }
    </script>
</body>

</html>
