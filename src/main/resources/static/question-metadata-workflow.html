<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic Gamified Scaffolding</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://polyfill.io/v3/polyfill.min.js?features=es6"></script>

    <script>
        window.MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            },
            startup: {
                typeset: false // We will handle the initial render manually in initUI
            }
        };
    </script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap');

        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc;
        }

        .locked-step {
            filter: blur(4px);
            pointer-events: none;
            opacity: 0.6;
        }

        .pulse-xp {
            animation: pulse-green 1s ease-out;
        }

        @keyframes pulse-green {
            0% {
                transform: scale(1);
                color: #10b981;
            }

            50% {
                transform: scale(1.2);
                color: #059669;
            }

            100% {
                transform: scale(1);
            }
        }
    </style>
</head>

<body class="text-slate-800 pb-20">

    <nav class="bg-white shadow-sm px-8 py-4 flex justify-between items-center sticky top-0 z-50">
        <div class="flex items-center gap-3">
            <div class="bg-indigo-600 text-white font-bold rounded-lg p-2 leading-none">EduAI</div>
            <span class="font-semibold text-slate-600">Interactive Assessment</span>
            <span class="font-bold text-indigo-600" id="xp-status"></span>
        </div>
        <div class="flex items-center gap-6">
            <div class="flex items-center gap-2 bg-slate-100 px-4 py-2 rounded-full shadow-inner">
                <span class="text-xl">⭐</span>
                <span class="font-bold text-indigo-600" id="xp-counter">0 XP</span>
            </div>
        </div>
    </nav>

    <main class="max-w-6xl mx-auto mt-8 grid grid-cols-1 lg:grid-cols-3 gap-8 px-4" id="app-wrapper">
        <div class="col-span-2 space-y-6" id="main-container">
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200" id="header-card">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="text-xl font-bold text-slate-800" id="ui-challenge-title">Loading Challenge...</h2>
                    <span class="bg-indigo-100 text-indigo-800 text-xs font-bold px-3 py-1 rounded-full shadow-sm"
                        id="ui-xp-reward"></span>
                </div>

                <div class="mt-6">
                    <div class="flex justify-between text-xs font-bold text-slate-400 mb-2">
                        <span>Progress</span>
                        <span id="progress-text">0%</span>
                    </div>
                    <div class="w-full bg-slate-100 rounded-full h-2.5">
                        <div class="bg-indigo-600 h-2.5 rounded-full transition-all duration-500" id="progress-bar"
                            style="width: 0%"></div>
                    </div>
                </div>
            </div>

            <div id="steps-container" class="space-y-6"></div>
        </div>

        <div class="col-span-1 space-y-4" id="lifelines-container">
            <h3 class="font-bold text-slate-800 uppercase text-xs tracking-wider mb-2">Smart Lifelines</h3>
        </div>
    </main>

    <script>
        // ==========================================
        // 1. FETCH DATA FROM DASHBOARD
        // ==========================================
        let payload;
        const storedData = sessionStorage.getItem('scaffoldPayload');

        // Note: For local testing, you might want to mock the payload if sessionStorage is empty
        if (storedData) {
            try {
                payload = JSON.parse(storedData);
                sessionStorage.removeItem('scaffoldPayload');
            } catch (e) {
                showError("The data passed from the dashboard was corrupted.");
            }
        } else {
            showError("No assessment data found. Please launch this page from the main dashboard.");
        }

        function showError(msg) {
            document.getElementById('app-wrapper').innerHTML = `
                <div class="col-span-3 text-center py-20">
                    <h1 class="text-3xl font-bold text-red-600 mb-4">⚠️ Data Missing</h1>
                    <p class="text-slate-600">${msg}</p>
                </div>
            `;
            throw new Error("Initialization halted.");
        }

        // ==========================================
        // 2. RENDERING ENGINE
        // ==========================================
        let currentProgress = 0;
        let totalXP = 0;

        function initUI() {
            if (!payload) return;

            // Render Header
            document.getElementById('ui-challenge-title').innerText = payload.challengeTitle || "Challenge Module";
            document.getElementById('ui-xp-reward').innerText = `+${payload.xpReward || 50} XP / step`;
            document.getElementById('xp-status').innerText = `+${payload.status || ''}`;

            // Render UI Components
            renderLifelines();
            renderSteps();

            // 2. MODIFIED: Tell MathJax to process only the areas we just injected text into
            if (window.MathJax) {
                MathJax.typesetPromise([
                    document.getElementById('lifelines-container'),
                    document.getElementById('steps-container')
                ]).catch((err) => console.log('MathJax error: ', err));
            }
        }

        function renderLifelines() {
            const container = document.getElementById('lifelines-container');
            const l = payload.lifelines;
            if (!l) return;

            const aiStrategy = l.aiStrategy || "No strategy provided.";
            const textbookConcept = l.textbook?.concept || "Concept";
            const textbookTheory = l.textbook?.theory || "";
            const formulas = l.textbook?.formulas || [];
            const realWorld = l.realWorld || "No real-world context provided.";

            container.innerHTML += `
                <button onclick="toggleCard('ai-brain')" class="w-full text-left bg-gradient-to-r from-purple-600 to-indigo-600 p-4 rounded-xl shadow-md hover:shadow-lg transition-transform group">
                    <div class="flex items-center gap-3 mb-1"><span class="text-2xl">🧠</span><h4 class="font-bold text-white group-hover:underline">AI Strategy Nudge</h4></div>
                    <p class="text-purple-100 text-xs">How would an expert think?</p>
                </button>
                <div id="ai-brain" class="hidden bg-purple-50 p-4 rounded-xl border border-purple-200 text-sm text-purple-900 shadow-inner leading-relaxed">
                    ${aiStrategy}
                </div>

                <button onclick="toggleCard('textbook')" class="w-full text-left bg-white border border-slate-200 p-4 rounded-xl shadow-sm hover:border-blue-400 hover:shadow-md transition-all group">
                    <div class="flex items-center gap-3 mb-1"><span class="text-2xl">📖</span><h4 class="font-bold text-slate-800 group-hover:text-blue-600">Textbook Reference</h4></div>
                    <p class="text-slate-500 text-xs">Exact formulas for this concept.</p>
                </button>
                <div id="textbook" class="hidden bg-blue-50 p-4 rounded-xl border border-blue-200 text-sm text-blue-900 shadow-inner">
                    <strong>${textbookConcept}</strong><br><br>
                    ${textbookTheory}<br><br>
                    ${formulas.map(f => `<div class="bg-white p-3 rounded border border-blue-200 text-center my-2 shadow-sm">${f}</div>`).join('')}
                </div>

                <button onclick="toggleCard('real-world')" class="w-full text-left bg-white border border-slate-200 p-4 rounded-xl shadow-sm hover:border-emerald-400 hover:shadow-md transition-all group">
                    <div class="flex items-center gap-3 mb-1"><span class="text-2xl">🌍</span><h4 class="font-bold text-slate-800 group-hover:text-emerald-600">Real-World Context</h4></div>
                    <p class="text-slate-500 text-xs">Why does this matter?</p>
                </button>
                <div id="real-world" class="hidden bg-emerald-50 p-4 rounded-xl border border-emerald-200 text-sm text-emerald-900 shadow-inner">
                    ${realWorld}
                </div>
            `;
        }

        function renderSteps() {
            const container = document.getElementById('steps-container');
            const steps = payload.steps || [];

            steps.forEach((step, index) => {
                const isFirst = index === 0;

                let inputsHTML = step.inputs.map((inp, i) => `
                    <div class="w-full">
                        <label class="block text-xs font-bold text-slate-500 mb-1">${inp.label}</label>
                        <input type="text" id="input-${index}-${i}" class="w-full border border-slate-300 rounded-lg px-4 py-2 focus:outline-none focus:border-indigo-500" placeholder="Your answer...">
                    </div>
                `).join('');

                container.innerHTML += `
                    <div class="bg-white p-6 rounded-2xl shadow-sm border ${isFirst ? 'border-indigo-200' : 'border-slate-200 locked-step hidden'} relative overflow-hidden transition-all duration-500" id="step-card-${index}">
                        <div class="absolute top-0 left-0 w-1 h-full bg-indigo-500"></div>
                        <h3 class="font-bold text-indigo-700 mb-2">${step.title}</h3>
                        <p class="text-sm text-slate-600 mb-4">${step.instruction}</p>
                        
                        <div id="feedback-${index}" class="hidden mb-4 p-4 rounded-lg text-sm"></div>

                        <div class="flex gap-4 items-end" id="input-group-${index}">
                            ${inputsHTML}
                            <button onclick="validateStep(${index})" class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2 px-6 rounded-lg transition-colors whitespace-nowrap shadow-sm">Submit</button>
                        </div>
                    </div>
                `;
            });
        }

        // ==========================================
        // 3. LOGIC & INTERACTIONS
        // ==========================================
        function toggleCard(id) {
            document.getElementById(id).classList.toggle('hidden');
        }

        function validateStep(stepIndex) {
            const stepData = payload.steps[stepIndex];
            let isCorrect = true;

            stepData.inputs.forEach((inp, i) => {
                const userVal = document.getElementById(`input-${stepIndex}-${i}`).value.trim().toLowerCase();
                const correctVal = String(inp.correctValue).trim().toLowerCase();

                if (userVal.replace(/\s/g, '') !== correctVal.replace(/\s/g, '')) {
                    isCorrect = false;
                }
            });

            const feedbackDiv = document.getElementById(`feedback-${stepIndex}`);
            const inputGroup = document.getElementById(`input-group-${stepIndex}`);
            const card = document.getElementById(`step-card-${stepIndex}`);

            if (isCorrect) {
                inputGroup.classList.add('hidden');
                feedbackDiv.classList.remove('hidden');
                feedbackDiv.className = "bg-green-50 p-4 rounded-lg text-sm text-green-800 border border-green-200 shadow-inner";
                feedbackDiv.innerHTML = `<strong>✅ Correct!</strong> ${stepData.successMessage}`;
                card.classList.replace('border-indigo-200', 'border-green-400');

                awardXP(payload.xpReward || 50);
            } else {
                inputGroup.classList.add('hidden');
                feedbackDiv.classList.remove('hidden');
                feedbackDiv.className = "bg-amber-50 p-4 rounded-lg text-sm text-amber-900 border border-amber-300 shadow-inner";

                const expectedAnswers = stepData.inputs.map(i => `<strong>${i.correctValue}</strong>`).join(', ');
                feedbackDiv.innerHTML = `<strong>💡 Let's review:</strong> ${stepData.revealMessage} <br><br><em>The exact answer required was: ${expectedAnswers}</em>`;
            }

            const totalSteps = payload.steps.length;
            currentProgress = Math.round(((stepIndex + 1) / totalSteps) * 100);
            document.getElementById('progress-bar').style.width = currentProgress + '%';
            document.getElementById('progress-text').innerText = currentProgress + '%';

            // 3. MODIFIED: Only typeset the specific feedback div that was just updated
            if (window.MathJax) {
                // We clear the typeset status of the specific element so MathJax knows to re-evaluate it
                MathJax.typesetClear([feedbackDiv]);
                MathJax.typesetPromise([feedbackDiv]).catch((err) => console.log('MathJax error: ', err));
            }

            if (stepIndex + 1 < totalSteps) {
                const nextCard = document.getElementById(`step-card-${stepIndex + 1}`);
                nextCard.classList.remove('hidden', 'locked-step');
                nextCard.classList.add('border-indigo-200', 'mt-6');
                setTimeout(() => nextCard.scrollIntoView({ behavior: 'smooth', block: 'center' }), 200);
            } else {
                renderFinalCelebration();
            }
        }

        function awardXP(amount) {
            totalXP += amount;
            const xpCounter = document.getElementById('xp-counter');
            xpCounter.innerText = totalXP.toLocaleString() + ' XP';
            xpCounter.classList.add('pulse-xp');
            setTimeout(() => xpCounter.classList.remove('pulse-xp'), 1000);
        }

        function renderFinalCelebration() {
            const container = document.getElementById('steps-container');
            container.innerHTML += `
                <div class="bg-gradient-to-r from-indigo-500 to-purple-600 p-8 rounded-2xl shadow-lg text-white text-center transform transition-all mt-8" id="celebration-card">
                    <span class="text-5xl block mb-4">🎉</span>
                    <h2 class="text-2xl font-bold mb-2">Challenge Conquered!</h2>
                    <p class="text-indigo-100 mb-4">You have successfully worked through all the steps. Excellent problem solving.</p>
                </div>
            `;
            setTimeout(() => window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' }), 300);
        }

        window.onload = initUI;
    </script>
</body>

</html>
