<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Problem Solver</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://polyfill.io/v3/polyfill.min.js?features=es6"></script>

    <script>
        window.MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            },
            startup: { typeset: false }
        };
    </script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap');

        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc;
        }

        .locked-step {
            filter: blur(3px);
            pointer-events: none;
            opacity: 0.5;
        }

        .pulse-xp {
            animation: pulse-green 0.8s ease-out;
        }

        @keyframes pulse-green {
            0% {
                transform: scale(1);
                color: #10b981;
            }

            50% {
                transform: scale(1.15);
                color: #059669;
            }

            100% {
                transform: scale(1);
            }
        }
    </style>
</head>

<body class="text-slate-800 pb-20">

    <nav class="bg-white shadow-sm px-8 py-4 flex justify-between items-center sticky top-0 z-50">
        <div class="flex items-center gap-3">
            <div class="bg-indigo-600 text-white font-bold rounded-lg p-2 leading-none">EduAI</div>
            <span class="font-semibold text-slate-600">Step-by-Step Solver</span>
        </div>
        <div class="flex items-center gap-6">
            <div
                class="flex items-center gap-2 bg-slate-100 px-4 py-2 rounded-full shadow-inner border border-slate-200">
                <span class="text-xl">⭐</span>
                <span class="font-bold text-indigo-600" id="xp-counter">0 XP</span>
            </div>
        </div>
    </nav>

    <main class="max-w-6xl mx-auto mt-8 grid grid-cols-1 lg:grid-cols-3 gap-8 px-4" id="app-wrapper">
        <div class="col-span-2 space-y-6">

            <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200">
                <div class="flex justify-between text-xs font-bold text-slate-400 mb-2 uppercase tracking-widest">
                    <span>Mastery Progress</span>
                    <span id="progress-text">0%</span>
                </div>
                <div class="w-full bg-slate-100 rounded-full h-2">
                    <div class="bg-indigo-600 h-2 rounded-full transition-all duration-700" id="progress-bar"
                        style="width: 0%"></div>
                </div>
            </div>

            <div class="bg-white rounded-2xl shadow-md border border-indigo-100 overflow-hidden" id="question-card">
                <div class="bg-indigo-600 px-6 py-3">
                    <h3 class="text-white font-bold flex items-center gap-2">
                        <span>📝</span> Main Challenge
                    </h3>
                </div>
                <div class="p-6 space-y-4">
                    <div id="ui-question-text" class="text-lg font-semibold text-slate-800 leading-relaxed"></div>
                    <div id="ui-question-details" class="grid grid-cols-1 md:grid-cols-2 gap-3"></div>
                    <div id="ui-answer-options" class="pt-4 border-t border-slate-100">
                        <span class="text-xs font-bold text-slate-400 uppercase block mb-3">Goal Result:</span>
                        <div id="options-list" class="flex flex-wrap gap-2"></div>
                    </div>
                </div>
            </div>

            <div id="steps-container" class="space-y-6"></div>
        </div>

        <div class="col-span-1 space-y-4" id="lifelines-container">
            <h3 class="font-bold text-slate-500 uppercase text-xs tracking-widest px-2">Smart Lifelines</h3>
        </div>
    </main>

    <script>
        let workflowData, questionRequest;

        const storedWorkflow = sessionStorage.getItem('scaffoldPayload');
        const storedRequest = sessionStorage.getItem('workflowRequest');

        if (storedWorkflow && storedRequest) {
            workflowData = JSON.parse(storedWorkflow);
            questionRequest = JSON.parse(storedRequest);
        } else {
            document.getElementById('app-wrapper').innerHTML = `<div class="col-span-3 text-center py-20 font-bold text-red-500">Error: Assessment data not found.</div>`;
        }

        let currentXP = 0;

        function initUI() {
            if (!workflowData || !questionRequest) return;

            renderQuestionSection();
            renderLifelines();
            renderSteps();

            if (window.MathJax) {
                MathJax.typesetPromise([
                    document.getElementById('question-card'),
                    document.getElementById('steps-container'),
                    document.getElementById('lifelines-container')
                ]);
            }
        }

        function renderQuestionSection() {
            document.getElementById('ui-question-text').innerHTML = questionRequest.questionText;

            const detailsContainer = document.getElementById('ui-question-details');
            if (questionRequest.details) {
                questionRequest.details.forEach(item => {
                    const div = document.createElement('div');
                    div.className = "bg-slate-50 border border-slate-200 p-3 rounded-lg text-sm text-slate-600 font-medium";
                    div.innerHTML = `📍 ${item.questionChoice}`;
                    detailsContainer.appendChild(div);
                });
            }

            const optionsList = document.getElementById('options-list');
            if (questionRequest.answerChoices) {
                questionRequest.answerChoices.forEach(choice => {
                    const span = document.createElement('span');
                    span.className = "bg-indigo-50 text-indigo-700 px-3 py-1 rounded-full text-sm border border-indigo-100 font-bold";
                    span.innerHTML = choice.choiceText;
                    optionsList.appendChild(span);
                });
            }
        }

        function renderLifelines() {
            const container = document.getElementById('lifelines-container');
            const l = workflowData.lifelines;
            if (!l) return;

            // Define the 3 types of lifeline cards
            const lifelineConfigs = [
                { id: 'ai-strat', title: 'AI Thinking Strategy', icon: '🧠', content: l.aiStrategy, color: 'purple' },
                { id: 'ref-card', title: 'Concept Reference', icon: '📖', content: `<strong>${l.textbook?.concept || ''}</strong><p class='mt-2'>${l.textbook?.theory || ''}</p>`, color: 'blue' },
                { id: 'real-world', title: 'Real-World Context', icon: '🌍', content: l.realWorld, color: 'emerald' }
            ];

            lifelineConfigs.forEach(card => {
                if (!card.content) return; // Skip if data is missing for this category

                container.innerHTML += `
                    <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden mb-3">
                        <button onclick="toggleCard('${card.id}')" class="w-full flex items-center justify-between p-4 hover:bg-slate-50 transition-colors">
                            <span class="font-bold text-slate-700 flex items-center gap-2"><span>${card.icon}</span> ${card.title}</span>
                            <span class="text-slate-400">▼</span>
                        </button>
                        <div id="${card.id}" class="hidden p-4 bg-${card.color}-50 text-sm leading-relaxed border-t border-${card.color}-100">
                            ${card.content}
                        </div>
                    </div>
                `;
            });
        }

        function renderSteps() {
            const container = document.getElementById('steps-container');
            workflowData.steps.forEach((step, idx) => {
                const isFirst = idx === 0;
                let inputsHTML = step.inputs.map((inp, i) => `
                    <div class="flex-1">
                        <label class="block text-[10px] uppercase font-black text-slate-400 mb-1">${inp.label}</label>
                        <input type="text" id="input-${idx}-${i}" class="w-full bg-slate-50 border border-slate-200 rounded-lg px-4 py-3 focus:ring-2 focus:ring-indigo-500 outline-none transition-all" placeholder="Enter value...">
                    </div>
                `).join('');

                container.innerHTML += `
                    <div class="bg-white p-6 rounded-2xl shadow-sm border-2 ${isFirst ? 'border-indigo-500' : 'border-slate-100 locked-step hidden'} relative" id="step-card-${idx}">
                        <div class="flex items-center gap-3 mb-4">
                            <span class="bg-indigo-600 text-white w-8 h-8 rounded-full flex items-center justify-center font-bold text-sm">${idx + 1}</span>
                            <h3 class="font-bold text-lg text-slate-800">${step.title}</h3>
                        </div>
                        <p class="text-slate-600 text-sm mb-6 bg-slate-50 p-3 rounded-lg border-l-4 border-indigo-400">${step.instruction}</p>
                        
                        <div id="feedback-${idx}" class="hidden mb-4 p-4 rounded-xl text-sm font-medium"></div>

                        <div class="flex flex-col md:flex-row gap-4 items-end" id="input-group-${idx}">
                            ${inputsHTML}
                            <button onclick="validateStep(${idx})" class="w-full md:w-auto bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 px-8 rounded-xl shadow-lg transition-all active:scale-95">Submit Step</button>
                        </div>
                    </div>
                `;
            });
        }

        function validateStep(idx) {
            const step = workflowData.steps[idx];
            let isCorrect = true;

            step.inputs.forEach((inp, i) => {
                const val = document.getElementById(`input-${idx}-${i}`).value.trim().toLowerCase();
                const correct = String(inp.correctValue).trim().toLowerCase();
                if (val.replace(/\s/g, '') !== correct.replace(/\s/g, '')) isCorrect = false;
            });

            const feedback = document.getElementById(`feedback-${idx}`);
            const inputGrp = document.getElementById(`input-group-${idx}`);
            const card = document.getElementById(`step-card-${idx}`);

            inputGrp.classList.add('hidden');
            feedback.classList.remove('hidden');

            if (isCorrect) {
                feedback.className = "p-4 rounded-xl text-sm bg-emerald-50 text-emerald-800 border border-emerald-200";
                feedback.innerHTML = `<strong>✅ Success!</strong> ${step.successMessage}`;
                card.classList.replace('border-indigo-500', 'border-emerald-500');
                updateXP(50);
            } else {
                feedback.className = "p-4 rounded-xl text-sm bg-amber-50 text-amber-900 border border-amber-200";
                feedback.innerHTML = `<strong>💡 Let's Look Closer:</strong> ${step.revealMessage} <br><div class='mt-2 text-xs opacity-75 italic'>Correct: ${step.inputs.map(i => i.correctValue).join(', ')}</div>`;
            }

            const prog = Math.round(((idx + 1) / workflowData.steps.length) * 100);
            document.getElementById('progress-bar').style.width = prog + '%';
            document.getElementById('progress-text').innerText = prog + '%';

            if (window.MathJax) MathJax.typesetPromise([feedback]);

            if (idx + 1 < workflowData.steps.length) {
                const next = document.getElementById(`step-card-${idx + 1}`);
                next.classList.remove('hidden', 'locked-step');
                next.classList.add('border-indigo-500', 'mt-4');
                setTimeout(() => next.scrollIntoView({ behavior: 'smooth', block: 'center' }), 300);
            } else {
                showFinal();
            }
        }

        function updateXP(val) {
            currentXP += val;
            const counter = document.getElementById('xp-counter');
            counter.innerText = currentXP + ' XP';
            counter.classList.add('pulse-xp');
            setTimeout(() => counter.classList.remove('pulse-xp'), 800);
        }

        function toggleCard(id) {
            document.getElementById(id).classList.toggle('hidden');
        }

        function showFinal() {
            const container = document.getElementById('steps-container');
            container.innerHTML += `
                <div class="bg-gradient-to-br from-indigo-600 to-purple-700 p-8 rounded-3xl text-white text-center shadow-2xl mt-10">
                    <div class="text-6xl mb-4">🏆</div>
                    <h2 class="text-3xl font-black mb-2">Challenge Conquered!</h2>
                    <p class="text-indigo-100">You've mastered the concept.</p>
                </div>
            `;
        }

        window.onload = initUI;
    </script>
</body>

</html>
